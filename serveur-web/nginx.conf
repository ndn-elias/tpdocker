# J'ai fait cette config pour que Nginx soit la seule entrée de l'appli du garage, comme ça les mécaniciens n'ont qu'une adresse à retenir.
# J'ai écrit ${APP_PORT} au lieu de 3000 car au démarrage, l'image Nginx remplace cette variable par la valeur du .env,
# comme ça le port du front et de l'API se change à un seul endroit.
server {
    # J'ai mis le port 80 car c'est par là que les mécaniciens arrivent sur l'appli (8080 sur le PC de l'atelier).
    listen 80;

    # J'ai mis "/" pour afficher la page d'accueil du garage quand on arrive sur le site.
    location / {
        # J'ai mis ce dossier car c'est là que mon Dockerfile copie la page d'accueil.
        root /usr/share/nginx/html;
        # J'ai mis index.html pour que la page d'accueil s'affiche sans taper son nom.
        index index.html;
    }

    # J'ai mis "/app/" pour envoyer les mécaniciens vers la liste des réparations (le front).
    location /app/ {
        # J'ai écrit "front" car c'est le nom du service dans docker-compose, Docker sait le retrouver sur le réseau.
        # J'ai mis un "/" à la fin pour enlever "/app" de l'adresse, car mon front ne connaît pas ce chemin.
        proxy_pass http://front:${APP_PORT}/;
    }

    # J'ai mis "/api/" pour envoyer les demandes de réparations vers l'API du garage (le back).
    location /api/ {
        # Je n'ai pas mis de "/" à la fin pour garder /api/reparations, car c'est la route que mon API attend.
        proxy_pass http://back:${APP_PORT};
    }
}
