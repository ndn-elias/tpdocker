<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#3f8f4f" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#b5772f" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: "Segoe Print", "Comic Sans MS", "Bradley Hand", cursive; fill: #2b2b2b; text-anchor: middle; }
    .title  { font-size: 20px; }
    .sub    { font-size: 15px; fill: #555; }
    .green  { font-size: 15px; fill: #3f8f4f; }
    .blue   { font-size: 15px; fill: #2f6fb5; }
    .orange { font-size: 15px; fill: #b5772f; }
    .frame  { font-size: 15px; fill: #888; text-anchor: start; }
  </style>

  <rect width="960" height="780" fill="#ffffff"/>

  <!-- Fichier .env -->
  <g filter="url(#rough)">
    <rect x="25" y="15" width="260" height="135" rx="10" fill="#fdf6ec" stroke="#b5772f" stroke-width="2.5"/>
  </g>
  <text x="155" y="42" class="title">.env</text>
  <text x="155" y="67" class="orange">NGINX_PORT=8080</text>
  <text x="155" y="89" class="orange">APP_PORT=3000</text>
  <text x="155" y="111" class="orange">NODE_ENV=production</text>
  <text x="155" y="133" class="orange">limites CPU / RAM</text>

  <!-- Utilisateur -->
  <g filter="url(#rough)">
    <ellipse cx="480" cy="70" rx="175" ry="52" fill="#ededed" stroke="#2b2b2b" stroke-width="2.5"/>
  </g>
  <text x="480" y="64" class="title">Utilisateur</text>
  <text x="480" y="90" class="sub">Mécanicien (localhost:8080)</text>

  <!-- Cadre docker compose / réseau -->
  <g filter="url(#rough)">
    <rect x="25" y="175" width="910" height="580" rx="18" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="10 8"/>
  </g>
  <text x="45" y="742" class="frame">docker compose · réseau garage-network</text>

  <!-- .env lu par docker compose -->
  <g fill="none" stroke="#b5772f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arrow-orange)">
    <path d="M 155 152 L 155 205"/>
  </g>
  <text x="168" y="200" class="orange" style="text-anchor: start">lu par docker compose</text>
  <text x="168" y="221" class="orange" style="text-anchor: start">puis passé avec environment</text>

  <!-- Flèches -->
  <g fill="none" stroke="#3f8f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#rough)">
    <path d="M 480 124 L 480 212"/>
    <path d="M 420 300 Q 300 330 228 372"/>
    <path d="M 540 300 Q 620 360 730 372"/>
    <path d="M 613 600 L 550 600"/>
  </g>
  <text x="515" y="180" class="green">:8080</text>
  <text x="345" y="362" class="green">/app/</text>
  <text x="610" y="380" class="green">/api/</text>

  <!-- Serveur web -->
  <g filter="url(#rough)">
    <polygon points="360,270 480,215 600,270 480,325" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
    <rect x="645" y="190" width="275" height="140" rx="16" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  </g>
  <text x="480" y="266" class="title">Serveur web</text>
  <text x="480" y="290" class="sub">nginx:1.27-alpine</text>
  <text x="782" y="212" class="blue">Sert index.html (/)</text>
  <text x="782" y="233" class="blue">Proxy vers front et back</text>
  <text x="782" y="254" class="blue">env : APP_PORT</text>
  <text x="782" y="275" class="blue">healthcheck · restart</text>
  <text x="782" y="296" class="blue">attend front + back healthy</text>
  <text x="782" y="317" class="blue">port 80 · 0.25 CPU · 32 Mo</text>

  <!-- Front -->
  <g filter="url(#rough)">
    <polygon points="100,430 220,375 340,430 220,485" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
    <rect x="95" y="520" width="250" height="160" rx="16" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  </g>
  <text x="220" y="426" class="title">Front</text>
  <text x="220" y="450" class="sub">node:22-alpine</text>
  <text x="220" y="548" class="blue">Liste des réparations</text>
  <text x="220" y="571" class="blue">port 3000 · non publié</text>
  <text x="220" y="594" class="blue">env : PORT, NODE_ENV</text>
  <text x="220" y="617" class="blue">user node · healthcheck</text>
  <text x="220" y="640" class="blue">restart: unless-stopped</text>
  <text x="220" y="663" class="blue">0.25 CPU · 64 Mo</text>

  <!-- Back -->
  <g filter="url(#rough)">
    <polygon points="620,430 740,375 860,430 740,485" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
    <rect x="615" y="520" width="250" height="160" rx="16" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  </g>
  <text x="740" y="426" class="title">Back</text>
  <text x="740" y="450" class="sub">node:22-alpine</text>
  <text x="740" y="548" class="blue">API /api/reparations</text>
  <text x="740" y="571" class="blue">port 3000 · non publié</text>
  <text x="740" y="594" class="blue">env : PORT, NODE_ENV</text>
  <text x="740" y="617" class="blue">user node · healthcheck</text>
  <text x="740" y="640" class="blue">restart: unless-stopped</text>
  <text x="740" y="663" class="blue">0.25 CPU · 32 Mo</text>

  <!-- Volume -->
  <g filter="url(#rough)" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5">
    <path d="M 415 530 L 415 625 A 65 14 0 0 0 545 625 L 545 530"/>
    <ellipse cx="480" cy="530" rx="65" ry="14"/>
  </g>
  <text x="480" y="568" class="title">Volume</text>
  <text x="480" y="592" class="sub">garage-data</text>
  <text x="480" y="614" class="sub">/app/data</text>
  <text x="480" y="664" class="sub">reparations.json</text>

  <!-- Liens losange -> description -->
  <g stroke="#2b2b2b" stroke-width="2" stroke-dasharray="4 5" filter="url(#rough)">
    <line x1="602" y1="270" x2="643" y2="270"/>
    <line x1="220" y1="487" x2="220" y2="518"/>
    <line x1="740" y1="487" x2="740" y2="518"/>
  </g>
</svg>
