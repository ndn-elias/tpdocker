<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1360" width="960" height="1360">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#3f8f4f" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#b5772f" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#7a4fb5" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: "Segoe Print", "Comic Sans MS", "Bradley Hand", cursive; fill: #2b2b2b; text-anchor: middle; }
    .title  { font-size: 20px; }
    .sub    { font-size: 15px; fill: #555; }
    .green  { font-size: 15px; fill: #3f8f4f; }
    .blue   { font-size: 15px; fill: #2f6fb5; }
    .orange { font-size: 15px; fill: #b5772f; }
    .purple { font-size: 15px; fill: #7a4fb5; }
    .frame  { font-size: 15px; fill: #888; text-anchor: start; }
  </style>

  <rect width="960" height="1360" fill="#ffffff"/>

  <!-- Fichier .env -->
  <g filter="url(#rough)">
    <rect x="25" y="15" width="260" height="160" rx="10" fill="#fdf6ec" stroke="#b5772f" stroke-width="2.5"/>
  </g>
  <text x="155" y="42" class="title">.env</text>
  <text x="155" y="67" class="orange">NGINX_PORT=8080</text>
  <text x="155" y="89" class="orange">APP_PORT=3000</text>
  <text x="155" y="111" class="orange">NODE_ENV=production</text>
  <text x="155" y="133" class="orange">CPU / RAM · arrêt (5 s)</text>
  <text x="155" y="155" class="orange">seuils de l'autoscaler</text>

  <text x="815" y="40" class="orange">chiffres affichés =</text>
  <text x="815" y="62" class="orange">valeurs par défaut du .env</text>

  <!-- Utilisateur -->
  <g filter="url(#rough)">
    <ellipse cx="480" cy="70" rx="175" ry="52" fill="#ededed" stroke="#2b2b2b" stroke-width="2.5"/>
  </g>
  <text x="480" y="64" class="title">Utilisateur</text>
  <text x="480" y="90" class="sub">Mécanicien (localhost:8080)</text>

  <!-- Cadre docker compose / stack Swarm / réseau -->
  <g filter="url(#rough)">
    <rect x="25" y="190" width="910" height="650" rx="18" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="10 8"/>
  </g>
  <text x="45" y="826" class="frame">docker compose ou stack Swarm « garage » · réseau garage-network (bridge / overlay)</text>

  <!-- .env lu par docker compose -->
  <g fill="none" stroke="#b5772f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arrow-orange)">
    <path d="M 155 177 L 155 228"/>
  </g>
  <text x="168" y="214" class="orange" style="text-anchor: start">lu par docker compose</text>
  <text x="168" y="234" class="orange" style="text-anchor: start">(ou deploy-swarm.bat)</text>
  <text x="168" y="254" class="orange" style="text-anchor: start">puis passé avec environment</text>

  <!-- Flèches de communication -->
  <g fill="none" stroke="#3f8f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#rough)">
    <path d="M 480 124 L 480 242"/>
    <path d="M 420 370 Q 300 400 228 442"/>
    <path d="M 540 370 Q 620 430 730 442"/>
    <path d="M 613 670 L 550 670"/>
  </g>
  <text x="495" y="165" class="green" style="text-anchor: start">:8080 (NGINX_PORT)</text>
  <text x="290" y="385" class="green">/app/</text>
  <text x="590" y="392" class="green">/api/</text>

  <!-- Copies (replicas) : cartes décalées derrière les descriptions -->
  <g fill="#ffffff" stroke="#2f6fb5" stroke-width="2" stroke-opacity="0.45" filter="url(#rough)">
    <rect x="102" y="597" width="250" height="205" rx="16"/>
    <rect x="108" y="603" width="250" height="205" rx="16"/>
    <rect x="622" y="597" width="250" height="205" rx="16"/>
    <rect x="628" y="603" width="250" height="205" rx="16"/>
    <rect x="646" y="211" width="270" height="195" rx="16"/>
    <rect x="652" y="217" width="270" height="195" rx="16"/>
  </g>

  <!-- Serveur web -->
  <g filter="url(#rough)">
    <polygon points="360,300 480,245 600,300 480,355" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
    <rect x="640" y="205" width="270" height="195" rx="16" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  </g>
  <text x="480" y="296" class="title">Serveur web</text>
  <text x="480" y="320" class="sub">nginx:1.27-alpine</text>
  <text x="775" y="233" class="blue">Sert index.html (/)</text>
  <text x="775" y="255" class="blue">Proxy vers front et back</text>
  <text x="775" y="277" class="blue">env : APP_PORT</text>
  <text x="775" y="299" class="blue">healthcheck · restart</text>
  <text x="775" y="321" class="blue">compose : attend front + back</text>
  <text x="775" y="343" class="blue">SIGQUIT → doux (5 s max)</text>
  <text x="775" y="365" class="blue">port 80 · 0.25 CPU · 32 Mo</text>
  <text x="775" y="387" class="blue">Swarm : 1 à 4 copies</text>

  <!-- Front -->
  <g filter="url(#rough)">
    <polygon points="100,500 220,445 340,500 220,555" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
    <rect x="95" y="590" width="250" height="205" rx="16" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  </g>
  <text x="220" y="496" class="title">Front</text>
  <text x="220" y="520" class="sub">node:22-alpine</text>
  <text x="220" y="618" class="blue">Liste des réparations</text>
  <text x="220" y="640" class="blue">APP_PORT (3000) · non publié</text>
  <text x="220" y="662" class="blue">env : PORT, NODE_ENV</text>
  <text x="220" y="684" class="blue">user node · healthcheck</text>
  <text x="220" y="706" class="blue">redémarrage automatique</text>
  <text x="220" y="728" class="blue">SIGTERM → arrêt propre</text>
  <text x="220" y="750" class="blue">0.25 CPU · 64 Mo</text>
  <text x="220" y="772" class="blue">Swarm : 1 à 4 copies</text>

  <!-- Back -->
  <g filter="url(#rough)">
    <polygon points="620,500 740,445 860,500 740,555" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
    <rect x="615" y="590" width="250" height="205" rx="16" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  </g>
  <text x="740" y="496" class="title">Back</text>
  <text x="740" y="520" class="sub">node:22-alpine</text>
  <text x="740" y="618" class="blue">API /api/reparations</text>
  <text x="740" y="640" class="blue">APP_PORT (3000) · non publié</text>
  <text x="740" y="662" class="blue">env : PORT, NODE_ENV</text>
  <text x="740" y="684" class="blue">user node · healthcheck</text>
  <text x="740" y="706" class="blue">redémarrage automatique</text>
  <text x="740" y="728" class="blue">SIGTERM → arrêt propre</text>
  <text x="740" y="750" class="blue">0.25 CPU · 32 Mo</text>
  <text x="740" y="772" class="blue">Swarm : 1 à 4 copies</text>

  <!-- Volume -->
  <g filter="url(#rough)" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5">
    <path d="M 415 600 L 415 695 A 65 14 0 0 0 545 695 L 545 600"/>
    <ellipse cx="480" cy="600" rx="65" ry="14"/>
  </g>
  <text x="480" y="638" class="title">Volume</text>
  <text x="480" y="662" class="sub">garage-data</text>
  <text x="480" y="684" class="sub">/app/data</text>
  <text x="480" y="734" class="sub">reparations.json</text>

  <!-- Liens losange -> description -->
  <g stroke="#2b2b2b" stroke-width="2" stroke-dasharray="4 5" filter="url(#rough)">
    <line x1="602" y1="300" x2="638" y2="300"/>
    <line x1="220" y1="557" x2="220" y2="588"/>
    <line x1="740" y1="557" x2="740" y2="588"/>
  </g>

  <!-- Autoscaler (Swarm seulement) -->
  <g filter="url(#rough)">
    <rect x="25" y="890" width="260" height="175" rx="16" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
  </g>
  <text x="155" y="918" class="title">Autoscaler</text>
  <text x="155" y="942" class="sub">alpine:3.21 + docker-cli</text>
  <text x="155" y="972" class="blue">Swarm seulement</text>
  <text x="155" y="994" class="blue">aucun réseau · aucun port</text>
  <text x="155" y="1016" class="blue">SIGTERM → trap, arrêt net</text>
  <text x="155" y="1038" class="blue">0.10 CPU · 32 Mo · 1 copie</text>

  <!-- Moteur Docker -->
  <g filter="url(#rough)">
    <ellipse cx="500" cy="965" rx="110" ry="50" fill="#ededed" stroke="#2b2b2b" stroke-width="2.5"/>
  </g>
  <text x="500" y="960" class="title">Moteur Docker</text>
  <text x="500" y="984" class="sub">manager Swarm</text>

  <!-- Autoscaler <-> moteur (docker.sock), moteur <-> stack (stats / scale) -->
  <g fill="none" stroke="#7a4fb5" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)">
    <path d="M 287 965 L 388 965"/>
    <path d="M 500 913 L 500 846"/>
  </g>
  <text x="338" y="950" class="purple">docker.sock</text>
  <text x="520" y="870" class="purple" style="text-anchor: start">docker stats : lit le CPU</text>
  <text x="520" y="892" class="purple" style="text-anchor: start">docker service scale</text>

  <!-- Règle de l'autoscaler -->
  <g filter="url(#rough)">
    <rect x="650" y="900" width="285" height="130" rx="12" fill="#faf7fd" stroke="#7a4fb5" stroke-width="2" stroke-dasharray="8 6"/>
  </g>
  <text x="792" y="930" class="purple">toutes les 15 s : mesure CPU</text>
  <text x="792" y="952" class="purple">&gt; 80 % de la limite : +1 copie</text>
  <text x="792" y="974" class="purple">&lt; 20 % de la limite : −1 copie</text>
  <text x="792" y="996" class="purple">1 à 4 copies · pause de 60 s</text>

  <!-- Projet (fichiers vérifiés par le lint) -->
  <g filter="url(#rough)">
    <rect x="25" y="1120" width="230" height="125" rx="16" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
  </g>
  <text x="140" y="1148" class="title">Projet</text>
  <text x="140" y="1172" class="sub">lu en lecture seule</text>
  <text x="140" y="1198" class="blue">*/Dockerfile · *.sh</text>
  <text x="140" y="1220" class="blue">front et back server.js</text>

  <!-- Projet -> lint -->
  <g fill="none" stroke="#3f8f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 257 1182 Q 308 1176 358 1182"/>
  </g>
  <text x="308" y="1166" class="green">./ → /src</text>
  <text x="308" y="1210" class="green">:ro</text>

  <!-- Lint (CI) -->
  <g filter="url(#rough)">
    <rect x="360" y="1100" width="575" height="215" rx="16" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
  </g>
  <text x="647" y="1130" class="title">Lint (CI)</text>
  <text x="647" y="1154" class="sub">node:22-alpine + hadolint, shellcheck, eslint</text>
  <text x="647" y="1186" class="blue">docker compose run --rm lint (profil lint)</text>
  <text x="647" y="1208" class="blue">hadolint : Dockerfiles · shellcheck : scripts · eslint : JS</text>
  <text x="647" y="1230" class="blue">network_mode: none · user node</text>
  <text x="647" y="1252" class="blue">env : LINT_CPUS, LINT_MEM (0.5 CPU · 256 Mo)</text>
  <text x="647" y="1274" class="blue">code de sortie : 0 = tout bon · 1 = erreur</text>

  <text x="45" y="1342" class="frame">Autoscaler : service du stack, sans réseau · Lint : à la demande, hors du stack</text>
</svg>
